<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14231f">
<title>EMBER — Приключение</title><meta name="description" content="Твой путь начинается в Забытом лесу. EMBER — пиксельная idle RPG.">
<link rel="stylesheet" href="game.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="game.js" defer></script>
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="coin" viewBox="0 0 32 32"><path fill="#6b4829" d="M10 2h12v3h5v5h3v12h-3v5h-5v3H10v-3H5v-5H2V10h3V5h5z"/><path fill="#f3c86d" d="M11 4h10v3h5v5h2v9h-3v5h-5v2h-9v-3H7v-5H4v-9h3V7h4z"/><path fill="#ad772f" d="M13 9h8v4h-8v2h6v3h-6v2h8v4h-8v-3h-4v-9h4z"/><path fill="#ffe3a1" d="M9 8h3v4H8v7H6v-8h3z"/></symbol>
<symbol id="gem" viewBox="0 0 32 32"><path fill="#192e35" d="M13 1h7l11 13v6L20 31h-7L1 18v-6z"/><path fill="#60c7b4" d="m15 3 13 12v3L18 29h-3L4 17v-3z"/><path fill="#b2f2d5" d="m15 6 4 5-9 8-4-4z"/><path fill="#32817e" d="m20 12 6 5-9 10-5-6z"/></symbol>
<symbol id="swords" viewBox="0 0 24 24"><path d="m4 3 13 13m-3 1 4-4m-2 5 4 3m0-18L7 16m-3-3 6 5m-4 0-3 3"/><path d="M4 3v4m0-4h4m12 0v4m0-4h-4"/></symbol>
<symbol id="chest" viewBox="0 0 48 48"><path fill="#1b2118" d="M9 9h28v4h4v29H5V13h4z"/><path fill="#936d3d" d="M10 13h26v7h3v18H9V20h1z"/><path fill="#d7b16d" d="M9 25h30v5H9zm3-12h4v25h-4zm20 0h4v25h-4z"/><path fill="#553d27" d="M9 31h30v7H9z"/><path fill="#f4d890" d="M20 23h9v11h-9z"/><path fill="#72532d" d="M23 26h3v5h-3z"/><path fill="#e0bc75" d="M16 7h4v4h-4zm8-5h4v7h-4zm10 5h4v4h-4z"/></symbol>
<symbol id="map" viewBox="0 0 48 48"><path fill="#13241f" d="m7 13 12-5 12 5 11-5v30l-12 5-11-5-12 5z"/><path fill="#bdc6a3" d="m9 15 9-4 12 5 10-4v24l-10 4-12-5-9 4z"/><path fill="#7f9979" d="m18 11 3 2v24l-3-2zm12 5 3-1v24l-3 1z"/><path fill="#e5cf8c" d="M13 25h5v3h-5zm7-5h6v3h-6zm8 6h6v3h-6z"/><path fill="#b16c46" d="M30 20h4v4h-4z"/></symbol>
<symbol id="camp" viewBox="0 0 32 32"><path d="m3 27 13-22 13 22H3Zm13-11v11m-4 0 4-11 4 11M6 6v6M3 9h6"/></symbol>
<symbol id="fist" viewBox="0 0 32 32"><path d="M9 16V9h4v6-9h4v9-7h4v8-5h4v10l-5 6H11l-5-9v-4h4l3 6"/></symbol>
<symbol id="bolt" viewBox="0 0 32 32"><path d="m18 3-12 16h9l-1 10 12-17h-9z"/></symbol>
<symbol id="flame" viewBox="0 0 32 36"><path fill="currentColor" stroke="none" d="M17 1v8h5v5h5v14h-5v5H9v-5H4V17h5v-6h5V1zm-2 17v5h-4v5h10v-9h-3v-5h-3z"/></symbol>
<symbol id="lock" viewBox="0 0 20 20"><rect x="5" y="8" width="10" height="9" rx="1"/><path d="M7 8V5a3 3 0 0 1 6 0v3m-3 4v2"/></symbol>
<symbol id="anvil" viewBox="0 0 64 64"><path d="M9 20h31l14-5-5 12-12 5v9l9 10H14l9-10v-9H9V20Zm5 31h32v6H14z"/><path d="M9 32h28M23 41h14"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main class="game-screen">
<section class="adventure" aria-label="Основной экран приключения">
<div class="battle-landscape" aria-hidden="true"></div><div class="landscape-shade" aria-hidden="true"></div>
<header class="hud">
<button class="profile" id="profile-button" aria-label="Профиль героя"><span class="avatar"><canvas id="avatar" width="32" height="32" aria-hidden="true"></canvas><span id="level-badge">1</span></span><span class="profile-info"><strong id="player-name">Странник</strong><span class="power"><svg><use href="#swords"/></svg><b>12</b><span>СИЛА</span></span></span></button>
<div class="wallet"><button class="currency gold" data-info="gold" aria-label="Золото: 0"><svg><use href="#coin"/></svg><strong>0</strong><span class="currency-plus">+</span></button><button class="currency crystals" data-info="crystals" aria-label="Кристаллы: 0"><svg><use href="#gem"/></svg><strong>0</strong><span class="currency-plus">+</span></button></div>
</header>
<div class="stage-heading"><p>ЗАБЫТЫЙ ЛЕС</p><h1>Битва <span>1–1</span></h1><div class="stage-progress" aria-label="Первая из трёх волн"><span class="progress-line"></span><span class="wave current"></span><span class="wave"></span><span class="wave boss"><svg><use href="#swords"/></svg></span></div></div>
<button class="side-action rewards" data-info="rewards" aria-label="Награды за битвы"><span class="action-art"><svg><use href="#chest"/></svg></span><span>Награды</span></button>
<button class="side-action map" data-info="map" aria-label="Карта приключения"><span class="action-art"><svg><use href="#map"/></svg></span><span>Карта</span></button>
<div class="battlefield" role="img" aria-label="Странник без экипировки в Забытом лесу. Впереди два лесных слизня и огонёк.">
<div class="ground-line"></div>
<div class="fighter player"><span class="healthbar"><i></i></span><span class="fighter-shadow"></span><canvas id="player-sprite" width="64" height="64" aria-hidden="true"></canvas><span class="fighter-name">Странник</span></div>
<div class="encounter-marker" aria-hidden="true"><span></span><svg><use href="#swords"/></svg><span></span></div>
<div class="fighter enemy enemy-one"><span class="healthbar enemy-health"><i></i></span><span class="fighter-shadow"></span><img src="assets/enemies/slime.svg" alt="" draggable="false"></div>
<div class="fighter enemy enemy-two"><span class="fighter-shadow"></span><img src="assets/enemies/slime.svg" alt="" draggable="false"></div>
<div class="fighter enemy enemy-three"><img src="assets/enemies/wisp.svg" alt="" draggable="false"></div>
<div class="mote m1"></div><div class="mote m2"></div><div class="mote m3"></div>
</div>
<div class="battle-controls"><div class="battle-state"><span class="state-dot"></span><span id="battle-state">В пути</span></div><div class="abilities"><button class="auto-button active" id="auto-button" aria-pressed="true" aria-label="Автобой включён"><span>АВТО</span><b id="auto-label">ВКЛ</b></button><button class="ability fist" data-info="fist" aria-label="Умение Натиск, откроется на третьем уровне"><svg><use href="#fist"/></svg><span class="ability-lock"><svg><use href="#lock"/></svg></span></button><button class="ability dash" data-info="dash" aria-label="Умение Рывок, откроется на пятом уровне"><svg><use href="#bolt"/></svg><span class="ability-lock"><svg><use href="#lock"/></svg></span></button><button class="ability fire" data-info="fire" aria-label="Умение Внутренний огонь, откроется на десятом уровне"><svg><use href="#flame"/></svg><span class="ability-lock"><svg><use href="#lock"/></svg></span></button></div></div>
<div class="arena-border" aria-hidden="true"><span></span></div>
</section>
<section class="lower-placeholder" aria-label="Нижняя панель — заглушка"><div class="placeholder-inner"><div class="placeholder-rune"><svg><use href="#anvil"/></svg></div><span class="soon-label">СЛЕДУЮЩАЯ ГЛАВА</span><h2>Продолжение следует</h2><p>Нижняя панель появится здесь</p><span class="placeholder-dots"><i></i><i></i><i></i></span></div><div class="ember-sign"><svg><use href="#flame"/></svg><span>EMBER</span></div></section>
</main>
<dialog id="game-dialog"><button class="dialog-close" aria-label="Закрыть"><svg><use href="#close"/></svg></button><p class="dialog-eyebrow" id="dialog-eyebrow">EMBER</p><h2 id="dialog-title"></h2><p id="dialog-copy"></p><a class="dialog-link" id="profile-link" href="create.html" hidden>Изменить облик</a><button class="dialog-action">Понятно</button></dialog>
<div class="sr-only" role="status" id="status"></div>
</body></html>
