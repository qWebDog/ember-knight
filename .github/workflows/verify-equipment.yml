name: Verify EMBER equipment
on:
  push:
    branches:
      - main
      - feature/warrior-equipment-slots
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game logic, progression and equipment sprites
        run: node --test tests/*.test.cjs
